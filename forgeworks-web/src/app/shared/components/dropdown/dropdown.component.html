<div 
  class="fw-dropdown" 
  [class.fw-dropdown--open]="isOpen()" 
  [class.fw-dropdown--disabled]="disabled()"
  [attr.id]="id() || null">
  
  <button 
    type="button" 
    class="fw-dropdown__trigger" 
    (click)="toggle()" 
    [disabled]="disabled()"
    [attr.aria-expanded]="isOpen()" 
    aria-haspopup="listbox">
    <span class="fw-dropdown__text" [class.fw-dropdown__text--placeholder]="!value()">
      {{ selectedLabel() || placeholder() }}
    </span>
    <span class="fw-dropdown__chevron" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </span>
  </button>

  @if (isOpen()) {
    <div class="fw-dropdown__menu" [class.fw-dropdown__menu--up]="openUpward()" role="listbox" [attr.aria-label]="placeholder()">
      @if (searchable()) {
        <div class="fw-dropdown__search-box" (click)="$event.stopPropagation()">
          <span class="fw-dropdown__search-icon" aria-hidden="true">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input
            type="text"
            class="fw-dropdown__search-input"
            [placeholder]="searchPlaceholder()"
            [value]="searchTerm()"
            (input)="onSearchInput($event)"
            (keydown.escape)="close()"
            autofocus
          />
        </div>
      }

      <div class="fw-dropdown__options">
        @for (opt of filteredOptions(); track opt.value) {
          <div 
            class="fw-dropdown__option" 
            [class.fw-dropdown__option--selected]="opt.value === value()"
            [class.fw-dropdown__option--disabled]="opt.disabled"
            (click)="selectOption(opt, $event)"
            role="option"
            [attr.aria-selected]="opt.value === value()">
            <div class="fw-dropdown__option-main">
              <span class="fw-dropdown__option-label">{{ opt.label }}</span>
              @if (opt.subtitle) {
                <span class="fw-dropdown__option-sub">{{ opt.subtitle }}</span>
              }
            </div>
            @if (opt.value === value()) {
              <span class="fw-dropdown__check" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </span>
            }
          </div>
        } @empty {
          <div class="fw-dropdown__empty">
            {{ searchTerm() ? 'No se encontraron resultados' : 'No hay opciones disponibles' }}
          </div>
        }
      </div>
    </div>
  }
</div>
