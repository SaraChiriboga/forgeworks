  <!-- 1. BARRA LATERAL IZQUIERDA (Verde Jungla #1F4032) -->

      </div>

      <!-- Menú de navegación principal -->
      <nav class="mt-6 px-3.5 space-y-1.5">
        <!-- Recursos -->
        <a routerLink="/recursos"
           routerLinkActive="bg-white/10 active-nav-glow text-white font-semibold"
           [routerLinkActiveOptions]="{exact: false}"
           class="flex items-center px-4 py-3 rounded-md text-[#9DB2A7] hover:text-white hover:bg-white/5 text-base font-medium tracking-wide transition-all group cursor-pointer">
          <span class="w-1.5 h-5 rounded-full bg-emerald-400 mr-3 -ml-0.5" [class.opacity-0]="currentSection() !== 'recursos'"></span>
          <svg class="w-5 h-5 mr-3 shrink-0 transition-colors" [class.text-emerald-400]="currentSection() === 'recursos'" [class.text-zinc-400]="currentSection() !== 'recursos'" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span class="flex-1">Recursos</span>
        </a>

        <!-- Productos -->
        <a routerLink="/productos"
           routerLinkActive="bg-white/10 active-nav-glow text-white font-semibold"
           [routerLinkActiveOptions]="{exact: false}"
           class="flex items-center px-4 py-3 rounded-md text-[#9DB2A7] hover:text-white hover:bg-white/5 text-base font-medium tracking-wide transition-all group cursor-pointer">
          <span class="w-1.5 h-5 rounded-full bg-emerald-400 mr-3 -ml-0.5" [class.opacity-0]="currentSection() !== 'productos'"></span>
          <svg class="w-5 h-5 mr-3 shrink-0 transition-colors" [class.text-emerald-400]="currentSection() === 'productos'" [class.text-zinc-400]="currentSection() !== 'productos'" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <rect height="7" rx="1.5" stroke-linecap="round" stroke-linejoin="round" width="7" x="3" y="3"></rect>
            <rect height="7" rx="1.5" stroke-linecap="round" stroke-linejoin="round" width="7" x="14" y="3"></rect>
            <rect height="7" rx="1.5" stroke-linecap="round" stroke-linejoin="round" width="7" x="3" y="14"></rect>
            <rect height="7" rx="1.5" stroke-linecap="round" stroke-linejoin="round" width="7" x="14" y="14"></rect>
          </svg>
          <span class="flex-1">Productos</span>
        </a>

        <!-- Instancias -->
        <a routerLink="/instancias"
           routerLinkActive="bg-white/10 active-nav-glow text-white font-semibold"
           [routerLinkActiveOptions]="{exact: false}"
           class="flex items-center px-4 py-3 rounded-md text-[#9DB2A7] hover:text-white hover:bg-white/5 text-base font-medium tracking-wide transition-all group cursor-pointer">
          <span class="w-1.5 h-5 rounded-full bg-emerald-400 mr-3 -ml-0.5" [class.opacity-0]="currentSection() !== 'instancias'"></span>
          <svg class="w-5 h-5 mr-3 shrink-0 transition-colors" [class.text-emerald-400]="currentSection() === 'instancias'" [class.text-zinc-400]="currentSection() !== 'instancias'" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span class="flex-1">Instancias</span>
        </a>
      </nav>
    </div>

    <!-- Indicador de estado y sesión inferior -->
    <div class="p-3.5 border-t border-white/10 mx-3 mb-3 bg-white/5 rounded-lg flex items-center justify-between text-xs text-[#9DB2A7]">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span class="font-mono text-[11px] text-zinc-300">Taller Activo</span>
      </div>
      <button (click)="logout()" title="Cerrar sesión" class="text-zinc-400 hover:text-white text-xs font-mono transition-colors flex items-center gap-1 cursor-pointer">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span>Salir</span>
      </button>
    </div>
  </aside>

  <!-- ÁREA DE CONTENIDO PRINCIPAL -->
  <div class="flex-1 flex flex-col h-full overflow-hidden bg-tech-white bg-grid-subtle">
    <!-- 2. BARRA SUPERIOR (HEADER) -->
    <header class="h-20 px-10 flex items-center justify-between border-b custom-border bg-white/60 backdrop-blur-md shrink-0 z-10">
      <div class="flex items-center gap-3.5 text-base font-medium tracking-tight text-concrete-gray">
        <span class="hover:text-forge-black cursor-pointer transition-colors text-base font-mono font-medium tracking-wide uppercase">Taller</span>
        <span class="text-zinc-400 font-mono text-base font-medium">/</span>
        <span class="hover:text-forge-black cursor-pointer transition-colors text-base font-mono font-medium tracking-wide uppercase">{{ breadcrumbSection() }}</span>
        <span class="text-zinc-400 font-mono text-base font-medium">/</span>
        <span class="text-forge-black font-semibold font-mono tracking-wide bg-zinc-100 px-4 py-1.5 rounded text-base shadow-xs border border-zinc-200/60 uppercase">
          {{ breadcrumbDetail() }}
        </span>
      </div>

      <div class="flex items-center gap-4">
        <div class="text-right">
          <div class="text-base font-semibold text-forge-black leading-tight">{{ workshopName() }}</div>
          <div class="text-xs font-mono text-concrete-gray mt-1 flex items-center justify-end gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span>
            <span>{{ artisanName() }}</span>
          </div>
        </div>
        <div class="w-11 h-11 rounded-lg bg-jungle-green/10 border border-jungle-green/20 flex items-center justify-center text-jungle-green font-mono text-sm font-bold tracking-wider shadow-xs">
          {{ avatarInitials() }}
        </div>
      </div>
    </header>

    <!-- AQUÍ SE RENDERIZA CADA PÁGINA (RECURSOS, PRODUCTOS, INSTANCIAS) -->
    <div class="flex-1 flex flex-col min-h-0 overflow-hidden">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
