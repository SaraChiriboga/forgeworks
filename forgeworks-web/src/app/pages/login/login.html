<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - ForgeWorks</title>
</head>
<body>
    <div class="login-container">
        <form (ngSubmit)="onSubmit()">
            <h1>Iniciar sesión</h1>
            <div>
                <label for="email">Correo Electrónico:</label>
                <input [(ngModel)]="email" placeholder="Correo Electrónico" name="email" />
            </div>
            <div>
                <label for="password">Contraseña:</label>
                <input [(ngModel)]="password" placeholder="Contraseña" name="password" type="password" />
            </div>
            <button type="submit">Iniciar sesión</button>
        </form>
        <p>{{ errorMessage }}</p>
    </div>
</body>
</html>
